# ==============================================================================
# Purpose: Self-contained Python dependency manifest for deploying the Cymbal
#          Bank Risk & Disputes Specialist ADK Agent to Vertex AI Agent Runtime.
# Architecture/Context: Deployed as a second independent Reasoning Engine with
#          `identity_type=AGENT_IDENTITY` so it receives a distinct privileged
#          SPIFFE workload identity governed by IAM UAP + Semantic Governance.
# Dependencies/Side Effects: Pins `google-auth>=2.40.0,<=2.60.0` for DPoP + TLS
#          inspection compatibility on `AGENT_TO_ANYWHERE` Agent Gateway.
# Author: Pradeep Singh
# License: Apache-2.0
# ==============================================================================

[project]
name = "risk-specialist-agent"
version = "1.0.0"
description = "Cymbal Bank Risk & Disputes Specialist ADK Agent (Privileged SPIFFE Tier)"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.5.0",
    "google-auth>=2.40.0,<=2.60.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
