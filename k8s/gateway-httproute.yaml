# ==============================================================================
# Purpose: GKE Gateway API (`Gateway` + `HTTPRoute`) exposing `cymbal-portal`
#          and `cymbal-banking-mcp` through a regional Google Cloud Application
#          Load Balancer (`gke-l7-regional-external-managed`).
# Architecture/Context: Aligns with GKE Gateway API patterns for self-managed
#          Agent Gateway attachments on GKE clusters.
# Dependencies/Side Effects: Provisions a regional managed proxy load balancer.
# Author: Pradeep Singh
# License: Apache-2.0
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cymbal-regional-gateway
  namespace: cymbal-agw
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cymbal-routes
  namespace: cymbal-agw
spec:
  parentRefs:
    - name: cymbal-regional-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: cymbal-banking-mcp
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cymbal-portal
          port: 80
