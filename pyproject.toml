# ==============================================================================
# Purpose: Root Python package and dependency manifest for the Cymbal Bank
#          Agent Gateway Demo workspace (services, shared models, agents, tests).
# Architecture/Context: Unifies dependencies for local development, FastMCP
#          server, Cymbal Bank Operations Portal, ADK agents, and pytest suites.
#          Pins `google-auth<=2.60.0` so Agent Identity SPIFFE workloads retain
#          certificate-bound + DPoP compatibility behind TLS-inspecting gateways.
# Dependencies/Side Effects: Managed with `uv sync --extra dev` or `pip`.
# Author: Pradeep Singh
# License: Apache-2.0
# ==============================================================================

[project]
name = "cymbal-agent-gateway-demo"
version = "1.0.0"
description = "Cymbal Bank Defense-in-Depth Demo for Google Cloud Agent Gateway"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "httpx>=0.27.2,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "mcp>=1.6.0,<2.0.0",
    "google-adk>=1.0.0",
    "google-genai>=1.5.0",
    "google-auth>=2.40.0,<=2.60.0",
    "google-cloud-firestore>=2.19.0,<3.0.0",
    "google-cloud-logging>=3.11.0,<4.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "services", "agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
